[project]
name = "lab1"
version = "0.1.0"
description = "Lab 1: modeling pointing time"
readme = "README.md"
requires-python = "==3.13.5"
dependencies = [
    "hyperopt>=0.3.0",
    "jupyter>=1.1.1",
    "numpy>=2.4.1",
    "pandas>=2.3.3",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
package = true
